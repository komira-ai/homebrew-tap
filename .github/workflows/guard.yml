# Job 1 of 2 of the tap's checks: the path guard. The job is named exactly `guard`; the repository ruleset requires a status
# check with that name.
#
# It runs on pull_request_target, so GitHub runs THIS file as it is on main, never the pull request's copy: a pull request
# cannot edit the guard that judges it. For that to hold, nothing here may check out, build or execute pull request code.
# The only checkout is of the base commit (the guard's own module); the pull request's files, branch and author are read
# through the API (.github/guard/guard.js), as data. The job has no secrets and a read-only token. test/lint_test.js pins all of this.
name: guard

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      # The login of the GitHub App that opens formula bump PRs: a repository variable, set by the repository owner.
      BOT_LOGIN: ${{ vars.TAP_BOT_LOGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Path guard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require(process.env.GITHUB_WORKSPACE + '/.github/guard/guard.js');
            await run({ github, context, core, botLogin: process.env.BOT_LOGIN });
